[project]
name = "tablesight"
version = "0.1.0"
description = "AI floor intelligence for hospitality (reasoning core, simulator, eval)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
platform = ["fastapi", "uvicorn", "cryptography", "httpx"]
eval = ["numpy"]
vision = ["numpy", "opencv-python-headless"]
dev = ["pytest", "ruff", "numpy", "fastapi", "uvicorn", "cryptography", "httpx", "playwright",
       "pip-audit"]

[tool.setuptools.packages.find]
include = ["tablesight*"]

[tool.setuptools.package-data]
"tablesight.i18n" = ["catalogs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tablesight/platform/app.py" = ["B008"]  # FastAPI Depends() defaults are the documented idiom
"tablesight/edge/agent.py" = ["BLE001"]  # any transport failure must buffer, never drop
